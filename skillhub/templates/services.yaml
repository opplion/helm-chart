apiVersion: v1
kind: Service
metadata:
  name: skillhub-server
  labels:
    app.kubernetes.io/name: skillhub-server
spec:
  selector:
    app.kubernetes.io/name: skillhub-server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: skillhub-scanner
  labels:
    app.kubernetes.io/name: skillhub-scanner
spec:
  selector:
    app.kubernetes.io/name: skillhub-scanner
  ports:
    - name: http
      port: {{ .Values.scanner.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: skillhub-web
  labels:
    app.kubernetes.io/name: skillhub-web
spec:
  selector:
    app.kubernetes.io/name: skillhub-web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
