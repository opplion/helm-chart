apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-server
  labels:
    app.kubernetes.io/name: skillhub-server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-server
    spec:
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.server.service.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.server.env.springProfilesActive | quote }}
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.secretRef.name }}
                  key: {{ .Values.server.secretRef.keys.datasourceUrl }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.secretRef.name }}
                  key: {{ .Values.server.secretRef.keys.datasourceUsername }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.secretRef.name }}
                  key: {{ .Values.server.secretRef.keys.datasourcePassword }}
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-host
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: redis-port
            - name: STORAGE_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: storage-base-path
            - name: SKILLHUB_SECURITY_SCANNER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skill-scanner-enabled
            - name: SKILLHUB_SECURITY_SCANNER_URL
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skill-scanner-url
            - name: SKILLHUB_SECURITY_SCANNER_MODE
              valueFrom:
                configMapKeyRef:
                  name: skillhub-config
                  key: skill-scanner-mode
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.server.env.sessionCookieSecure | quote }}
            - name: OAUTH2_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.secretRef.name }}
                  key: {{ .Values.server.secretRef.keys.githubClientId }}
                  optional: true
            - name: OAUTH2_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.secretRef.name }}
                  key: {{ .Values.server.secretRef.keys.githubClientSecret }}
                  optional: true
          volumeMounts:
            - name: skillhub-storage
              mountPath: /var/lib/skillhub/storage
          readinessProbe:
            httpGet:
              path: {{ .Values.server.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.server.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.server.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.server.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.probes.liveness.periodSeconds }}
      volumes:
        - name: skillhub-storage
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvc.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-scanner
  labels:
    app.kubernetes.io/name: skillhub-scanner
spec:
  replicas: {{ .Values.scanner.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub-scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub-scanner
    spec:
      containers:
        - name: scanner
          image: "{{ .Values.scanner.image.repository }}:{{ .Values.scanner.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.scanner.service.port }}
              name: http
          env:
            - name: SKILL_SCANNER_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scanner.secretRef.name }}
                  key: {{ .Values.scanner.secretRef.keys.llmApiKey }}
                  optional: true
            - name: SKILL_SCANNER_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scanner.secretRef.name }}
                  key: {{ .Values.scanner.secretRef.keys.llmModel }}
                  optional: true
          readinessProbe:
            httpGet:
              path: {{ .Values.scanner.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.scanner.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.scanner.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.scanner.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.scanner.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.scanner.probes.liveness.periodSeconds }}
---
